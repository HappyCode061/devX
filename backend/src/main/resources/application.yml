spring:
  application:
    name: devx-assistant
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devx_assistant}
    username: ${DB_USERNAME:devx}
    password: ${DB_PASSWORD:devx}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.happy.devx: INFO

devx:
  llm:
    enabled: false
    provider: draft
    model: retrieval-draft-v1
    base-url: "https://api.openai.com/v1"
    api-key: ${LLM_API_KEY:}
    max-context-characters: 2000
    max-context-documents: 3
    max-context-chunks-per-document: 1
