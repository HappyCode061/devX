version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devx_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-devx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
